apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-deployment
  namespace: production
spec:
  # production gets more replicas than dev
  replicas: 3
  selector:
    matchLabels:
      app: flask
  template:
    metadata:
      labels:
        app: flask
    spec:
      containers:
        - name: flask
          image: iamwaseem9746/flask-k8s:latest
          envFrom:
            - configMapRef:
                name: flask-config
            - secretRef:
                name: flask-secret
          ports:
            - containerPort: 5000
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10