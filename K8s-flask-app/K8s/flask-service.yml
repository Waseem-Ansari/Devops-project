apiVersion: v1
kind: Service
metadata:
  name: flask-service

spec:
  # nodePort service type exposes the service on each node's IP at a static port (the NodePort). A ClusterIP service, to which the NodePort service routes, is automatically created.
  type: NodePort
  #route traffic to pods with label app=flask
  selector:
    app: flask
  ports:
    # service port inside the cluster
    - port: 5000
      # pod port to route traffic to
      targetPort: 5000  
      # node port to expose the service on each node's IP
      nodePort: 30080