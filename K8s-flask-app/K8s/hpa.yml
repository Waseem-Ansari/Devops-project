apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flask-hpa
spec:
  # which deployment to scale
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flask-deployment
  # minimum number of pods to run
  minReplicas: 2
  # maximum number of pods to run
  maxReplicas: 10
  # when to scale 
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # scale when CPU usage is above 50%
          averageUtilization: 50