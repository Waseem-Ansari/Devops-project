apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits

spec:
  limits:
    - type: Container
      # applied to any containert that does not have resource limits set
      default:
        cpu: "500m"
        memory: "256Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      # no container can use more than this
      max:
        cpu: "2000m"
        memory: "1Gi"