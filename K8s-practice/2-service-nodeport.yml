apiVersion: v1
kind: Service
metadata:
  name: flask-nodeport
spec:
  selector:
    app: flask
  ports:
    #port that the service exposes
    - port: 80
    #port that the service sends traffic to on the pod
      targetPort: 80  
      #port exposed on each node in the cluster to access the service from outside the cluster
      nodePort: 30080
    # Nodeport accessible from outside cluster
  type: NodePort