#For demonstration and practice purposes, the actual `secret.yaml` file containing sensitive application credentials has been explicitly excluded from this repository via 
#In a production environment, secrets should never be committed to Git in plain text. Instead, I would manage them using:
#- **Environment Variables** mapped at runtime.
#- GitOps encryption tools like **Bitnami Sealed Secrets** or **SOPS**.
#- External secret stores like **HashiCorp Vault** or **AWS Secrets Manager**.

apiVersion: v1
kind: Secret
metadata:
  # Name of the Secret
  name: flask-secret  
# Opaque = generic secret type
type: Opaque
# values must be base64 encoded
# never store plain text in secret yaml files
stringData:
  # kubernetes will automatically base64 encode the values in stringData
  # database password
  DB_PASSWORD: YOUR_BASE64_ENCODED_PASSWORD_HERE # Do NOT commit real values
  API_KEY: YOUR_BASE64_ENCODED_TOKEN_HERE     # Use 'echo -n "value" | base64' locally