apiVersion: apps/v1
kind: Deployment
metadata:
  # Name of the Deployment
  name: flask-deployment-with-config
spec:
  # Number of replicas (pods) to create
  replicas: 2
  selector:
    matchLabels:
      # Label to identify the pods managed by this deployment
      app: flask-app
  template:
    metadata:
      labels:
        # Label to identify the pods managed by this deployment
        app: flask-app
    spec:
      containers:
        - name: flask-container
          # Docker image to use for the container
          image: nginx:alpine
          ports:
            - containerPort: 80
          # Injecting environment variables from ConfigMap as environment variables into the container
          envFrom:
            # Reference to the ConfigMap named "flask-config" to inject its key-value pairs as environment variables
            - configMapRef:
                name: flask-config
              
            # Reference to the Secret named "flask-secret" to inject its key-value pairs as environment variables
            # all secrets will be injected as environment variables into the container
            - secretRef:
                name: flask-secret